[project]
name = "time-deposit"
version = "0.1.0"
description = "Time deposit API for the XA Bank refactoring kata"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "psycopg-pool>=3.3.3",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "testcontainers[postgres]",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--cov", "--cov-report=term-missing"]

[tool.coverage.run]
branch = true
source = [
    "api",
    "application",
    "export_openapi",
    "interest_policies",
    "postgres",
    "time_deposit",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "if __name__ == .__main__.:",
]
