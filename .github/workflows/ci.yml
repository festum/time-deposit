name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          working-directory: python
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest --cov-report=xml --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            uv run coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: python/coverage.xml
          if-no-files-found: warn

  compose:
    name: Compose demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          working-directory: python
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Export the contract
        run: uv run python export_openapi.py
      - name: Start the stack
        run: docker compose -f ../compose.yaml up --build -d
      - name: Exercise both operations
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8000/time-deposits; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          curl -fsS http://localhost:8000/time-deposits > seeded.json
          uv run python -c 'import json, sys; count = len(json.load(open("seeded.json"))); sys.exit(0 if count == 5 else f"expected 5 deposits, got {count}")'

          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/time-deposits/update-balances)
          test "$status" = 204

          curl -fsS http://localhost:8000/time-deposits > accrued.json
          uv run python -c 'import json, sys; balances = [d["balance"] for d in json.load(open("accrued.json"))]; expected = [1201.0, 1203.0, 1205.0, 1200.0, 1200.0]; sys.exit(0 if balances == expected else f"unexpected balances {balances}")'

          status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/openapi.json)
          test "$status" = 200
      - name: Stop the stack
        if: always()
        run: docker compose -f ../compose.yaml down -v
